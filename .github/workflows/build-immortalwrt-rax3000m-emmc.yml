name: Build AkiSenSCWrt (RAX3000M eMMC)
on:
  workflow_dispatch:
    inputs:
      use_ccache:
        description: Reuse compiler cache
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: rax3000m-emmc-mtk
  cancel-in-progress: false
env:
  TZ: Asia/Hong_Kong
  SOURCE_DIR: /workdir/immortalwrt
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Require private build settings
        env:
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          test -n "$WIFI_PASSWORD"
          test -n "$ARTIFACT_PASSWORD"
      - name: Free build space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev python3 \
            python3-setuptools python3-dev python3-ply python3-docutils rsync \
            unzip zstd file wget curl swig subversion help2man libtool autoconf \
            automake autopoint gperf intltool pkgconf cmake ninja-build \
            genisoimage device-tree-compiler libglib2.0-dev libyaml-dev \
            libreadline-dev texinfo gnutls-dev libltdl-dev antlr3 asciidoc \
            lib32gcc-s1 libc6-dev-i386 re2c gnupg
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir
          mkdir -p "$HOME/.ccache"
          ccache -M 6G
      - name: Restore compiler cache
        if: inputs.use_ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mtk66-${{ hashFiles('sources.lock.json', 'rax3000m-emmc.config') }}-${{ github.run_id }}
          restore-keys: |
            ccache-mtk66-${{ hashFiles('sources.lock.json', 'rax3000m-emmc.config') }}-
            ccache-mtk66-
      - name: Fetch pinned firmware and feeds
        run: |
          python3 scripts/checkout-source.py "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure MTK driver and private defaults
        env:
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          cd "$SOURCE_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/prepare.py"
          ./scripts/config --set-str CCACHE_DIR "$HOME/.ccache"
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/verify.py" config .config
      - name: Download package sources
        run: |
          cd "$SOURCE_DIR"
          make download -j8 || make download -j1 V=s
      - name: Compile firmware
        run: |
          cd "$SOURCE_DIR"
          make -j"$(nproc)" || make -j1 V=s
      - name: Verify firmware and preserve matching IPKs
        run: |
          cd "$SOURCE_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/collect.py" /workdir/output
      - name: Encrypt personal firmware
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/encrypted"
          tar -C /workdir/output -czf /workdir/AkiSenSCWrt.tar.gz .
          printf '%s' "$ARTIFACT_PASSWORD" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$GITHUB_WORKSPACE/encrypted/AkiSenSCWrt-${GITHUB_RUN_NUMBER}.tar.gz.gpg" \
            /workdir/AkiSenSCWrt.tar.gz
          cd "$GITHUB_WORKSPACE/encrypted"
          sha256sum ./*.gpg > SHA256SUMS.txt
      - name: Upload encrypted firmware
        uses: actions/upload-artifact@v4
        with:
          name: AkiSenSCWrt-MTK66-encrypted-${{ github.run_number }}
          path: encrypted/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            /workdir/immortalwrt/logs/
            /workdir/immortalwrt/.config
          if-no-files-found: ignore
          retention-days: 7
